# Server override: publish every port on 127.0.0.1 only.
#
# Upstream's docker-compose.yaml publishes all services on every interface,
# including the sandbox runner (port 2000, which would let anyone skip the
# API), Redis (password "localdev") and MinIO (minioadmin/minioadmin).
# Docker-published ports also bypass firewalld, so a firewall rule does not
# hide them. Use this on any machine reachable from a network:
#
#   docker compose -f docker-compose.yaml -f docker-compose.images.yml \
#     -f docker-compose.server.yml up -d
#
# Reach the API through an SSH tunnel (see README.md). To expose the API
# directly instead, set CODEAPI_API_BIND=0.0.0.0, but only after turning on
# authentication (LOCAL_MODE=false); with the defaults anyone who can reach
# port 3112 can run code on this server.
#
# Needs Docker Compose 2.24.4 or later for `!override`.

services:
  api:
    ports: !override
      - ${CODEAPI_API_BIND:-127.0.0.1}:3112:3112
  egress_gateway:
    ports: !override
      - 127.0.0.1:3190:3190
  sandbox-runner:
    ports: !override
      - 127.0.0.1:2000:2000
  file_server:
    ports: !override
      - 127.0.0.1:${CODEAPI_FILE_SERVER_PORT:-13000}:3000
  redis:
    ports: !override
      - 127.0.0.1:${CODEAPI_REDIS_PORT:-16379}:6379
  minio:
    ports: !override
      - 127.0.0.1:${CODEAPI_MINIO_PORT:-19000}:9000
      - 127.0.0.1:${CODEAPI_MINIO_CONSOLE_PORT:-19001}:9001
