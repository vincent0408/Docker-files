# Path B (KVM) only: run the sandbox runner from the locally patched image.
#
# The published v1.10.4 KVM runner cannot load its native pipe addon inside
# the microVM, so every execution fails with "Sandbox execution failed"
# (sandbox-runner log: "Cannot find module ...anonymous-pipes.node"). Build
# the patched image first (README step B5b):
#
#   curl -fsSL https://raw.githubusercontent.com/vincent0408/Docker-files/master/code-interpreter/v1.10.4/Dockerfile.runner-pipe-addon-fix \
#     | docker build -t local/code-interpreter-sandbox-runner:v1.10.4-pipe-addon-fix -
#
# List this file after docker-compose.images.yml in COMPOSE_FILE. Drop it once
# upstream fixes the KVM guest. Details: KVM-RUNNER-PATCH.md.

services:
  sandbox-runner:
    image: local/code-interpreter-sandbox-runner:v1.10.4-pipe-addon-fix
    pull_policy: never
