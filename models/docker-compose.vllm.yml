# Qwen3 FP8 embedding + reranker on vLLM, used by Open WebUI for document search.
# Run from this folder after joining the split weight files (see README.md):
#   docker compose -f docker-compose.vllm.yml up -d
# Needs an NVIDIA GPU and the NVIDIA Container Toolkit. Uses the 4B pair; for
# the 8B pair, change the two --model / --chat-template paths below.

x-gpu: &gpu
  image: vllm/vllm-openai:latest   # pin a version you have tested
  ipc: host
  volumes:
    - ./:/models:ro
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped

services:
  embed:
    <<: *gpu
    command:
      - --model=/models/Qwen3-Embedding-4B-FP8-Dynamic
      - --served-model-name=qwen3-embedding
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=0.35   # both servers share one GPU
    ports:
      - "127.0.0.1:8001:8000"

  rerank:
    <<: *gpu
    command:
      - --model=/models/Qwen3-Reranker-4B-FP8-Dynamic
      - --served-model-name=qwen3-reranker
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=0.35
      - '--hf-overrides={"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
      - --chat-template=/models/Qwen3-Reranker-4B-FP8-Dynamic/chat_template.jinja
    ports:
      - "127.0.0.1:8002:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.12.3
    depends_on: [embed, rerank]
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://embed:8000/v1
      RAG_OPENAI_API_KEY: unused
      RAG_EMBEDDING_MODEL: qwen3-embedding
      RAG_EMBEDDING_QUERY_PREFIX: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_ENGINE: external
      RAG_EXTERNAL_RERANKER_URL: http://rerank:8000/v1/rerank
      RAG_RERANKING_MODEL: qwen3-reranker
    restart: unless-stopped

volumes:
  open-webui:
