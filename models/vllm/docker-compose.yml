# Qwen3 FP8 reranker on vLLM, with an OpenAI/Cohere-style /v1/rerank endpoint.
# Run from this folder after joining the split weight files (see ../README.md):
#   docker compose up -d
# Needs an NVIDIA GPU and the NVIDIA Container Toolkit. Uses the 4B reranker;
# for the 8B one, change both /models/... paths below.

services:
  rerank:
    image: vllm/vllm-openai:latest   # pin a version you have tested
    ipc: host
    volumes:
      - ./:/models:ro
    command:
      - --model=/models/Qwen3-Reranker-4B-FP8-Dynamic
      - --served-model-name=qwen3-reranker
      - --runner=pooling
      - --max-model-len=8192
      - '--hf-overrides={"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
      - --chat-template=/models/Qwen3-Reranker-4B-FP8-Dynamic/chat_template.jinja
    ports:
      - "127.0.0.1:8002:8000"   # drop 127.0.0.1: to expose it to other machines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
